<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Burn-After-Reading P2P Chat</title>
    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
    <style>
        body { 
            font-family: 'Inter', system-ui, sans-serif; 
            background: #050510; /* Deep Space Black */
            color: #e0e0e0; 
            padding: 20px; 
            max-width: 600px; 
            margin: 0 auto; 
        }
        .box { 
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1); 
            padding: 20px; 
            margin-bottom: 20px; 
            border-radius: 12px;
            backdrop-filter: blur(10px);
        }
        h3 { margin-top: 0; color: #8B5CF6; /* Primary Purple */ }
        input, button { 
            background: rgba(0, 0, 0, 0.5); 
            color: #fff; 
            border: 1px solid #8B5CF6; 
            padding: 12px; 
            margin: 5px 0; 
            width: 100%; 
            box-sizing: border-box; 
            border-radius: 6px;
        }
        button { 
            background: #8B5CF6; 
            color: #fff;
            cursor: pointer; 
            font-weight: bold; 
            transition: 0.2s ease;
        }
        button:hover { background: #da21ff; /* Hot Magenta */ border-color: #da21ff; }
        
        #chat-box { 
            min-height: 250px; 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            background: rgba(0,0,0,0.3);
            padding: 15px; 
            margin-top: 15px; 
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .message { 
            padding: 12px 16px; 
            border-radius: 8px; 
            animation: fadeIn 0.3s ease-out; 
            max-width: 80%;
            word-wrap: break-word;
        }
        .sent { 
            background: #8B5CF6; 
            color: white; 
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }
        .received { 
            background: #2a2a35; 
            color: white; 
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }
        .hidden-msg { 
            background: #1a1a24; 
            color: #da21ff;
            cursor: pointer; 
            border: 1px dashed #da21ff;
            text-align: center;
            font-weight: bold;
        }
        .hidden-msg:hover {
            background: rgba(218, 33, 255, 0.1);
        }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="box">
        <h3>1. Your Identity</h3>
        <p>Your Random ID: <strong id="my-id" style="color: #da21ff;">Generating...</strong></p>
        <p style="font-size: 0.85em; color: #888;">Share this ID with the other device to establish a direct P2P connection.</p>
    </div>

    <div class="box">
        <h3>2. Connect to Peer</h3>
        <input type="text" id="peer-id-input" placeholder="Paste the other device's ID here...">
        <button onclick="connectToPeer()">Establish Connection</button>
        <p id="connection-status" style="font-weight: bold; color: #888;">Status: Disconnected</p>
    </div>

    <div class="box">
        <h3>3. Secure Chat</h3>
        <input type="text" id="msg-input" placeholder="Type a secret message...">
        <button onclick="sendMessage()">Send Secure Message</button>
        
        <div id="chat-box"></div>
    </div>

    <script>
        // 1. Initialize PeerJS (Generates random ID automatically via public signaling server)
        const peer = new Peer(); 
        let conn; // Variable to hold the active connection

        const chatBox = document.getElementById('chat-box');
        const statusText = document.getElementById('connection-status');

        // When Peer is ready, display the ID
        peer.on('open', (id) => {
            document.getElementById('my-id').innerText = id;
        });

        // 2. Listen for incoming connections (If the other device connects to you)
        peer.on('connection', (connection) => {
            conn = connection;
            setupConnection();
        });

        // 3. Connect to someone else (If you initiate the connection)
        function connectToPeer() {
            const peerId = document.getElementById('peer-id-input').value;
            if (!peerId) return alert("Please enter a valid ID.");
            conn = peer.connect(peerId);
            setupConnection();
        }

        // 4. Handle the active connection data flow
        function setupConnection() {
            conn.on('open', () => {
                statusText.innerText = "Status: Connected Securely!";
                statusText.style.color = "#00ffcc";
            });

            // Triggered when a message arrives from the other device
            conn.on('data', (data) => {
                displayReceivedMessage(data);
            });
        }

        // 5. Send a message to the other device
        function sendMessage() {
            if (!conn || !conn.open) return alert("You are not connected to anyone!");
            const msgInput = document.getElementById('msg-input');
            const msg = msgInput.value;
            if (msg.trim() === "") return;
            
            conn.send(msg); // Send directly to peer over WebRTC
            
            // Show on our screen briefly, then delete
            const msgElement = document.createElement('div');
            msgElement.className = 'message sent';
            msgElement.innerText = msg;
            chatBox.appendChild(msgElement);
            
            msgInput.value = ''; // Clear input

            // Auto-delete our own sent message after 3 seconds
            setTimeout(() => { 
                if (document.body.contains(msgElement)) {
                    msgElement.remove(); 
                }
            }, 3000);
            
            // Auto-scroll to bottom
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // 6. EXACT BURN-AFTER-READING LOGIC
        function displayReceivedMessage(msg) {
            // 1. Message arrives locked
            const msgContainer = document.createElement('div');
            msgContainer.className = 'message received hidden-msg';
            msgContainer.innerText = "🔒 Locked Message. Tap to read.";
            
            // 2. The user must tap it to read it
            msgContainer.onclick = function() {
                // Reveal the actual message text
                msgContainer.innerText = msg;
                msgContainer.classList.remove('hidden-msg');
                msgContainer.style.cursor = 'default';
                
                // 3. Once tapped, a 5-second Javascript timer starts
                setTimeout(() => {
                    // 4. deletes it completely from the DOM (the webpage's memory)
                    if (document.body.contains(msgContainer)) {
                        msgContainer.remove(); 
                    }
                }, 5000);
                
                // Prevent clicking again to restart the timer
                msgContainer.onclick = null; 
            };

            chatBox.appendChild(msgContainer);
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
